# Compiles the release variant and runs the JVM unit tests on every push and pull request.
#
# No signing here on purpose: keystore.properties is absent on CI, and the build treats
# that as "release, unsigned" rather than an error (see app/build.gradle.kts). A signed
# APK/AAB is produced on a developer machine that holds the keystore.
name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # compileSdk is 36.1 (see app/build.gradle.kts); the default image lacks it.
          packages: "platforms;android-36 platforms;android-36.1 build-tools;36.0.0 platform-tools"
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release build
        run: ./gradlew testReleaseUnitTest assembleRelease --console=plain --no-daemon

      - name: Keep the unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testReleaseUnitTest
          if-no-files-found: ignore
